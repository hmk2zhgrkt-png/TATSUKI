name: Screenshot OCR parser tests
on:
  push:
    paths:
      - screenshot_parser.py
      - test_screenshot_parser.py
      - .github/workflows/test-ocr.yml
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run OCR parsing regression tests
        run: python -m unittest -v test_screenshot_parser
